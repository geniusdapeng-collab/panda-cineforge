{
  "schemaVersion": "workloom.outcome-suite/v1",
  "role": "biz-analyst",
  "agentPreset": "biz-analyst",
  "trials": 5,
  "businessScope": "电商经营报表口径",
  "deliverableUnit": "电商经营口径核查摘要",
  "minimumSubstance": "SKU 与集团口径勾稽、来源、预算偏差线索与未核实项；不捏造经营指标",
  "notes": "正常任务仅请求行业核查摘要，禁止执行实际业务写入；执行器仍会创建带 marker 的验收线程。配置有效不证明经营指标、生产能力或完整RDAS通过。",
  "tasks": [
    {
      "id": "INDUSTRY-NORMAL",
      "scenario": "normal",
      "criticality": "P0",
      "title": "电商经营报表口径",
      "input": "当前电商集团经营周报如何勾稽 SKU 损益、平台汇总与预算执行偏差？请用“经营”标注口径、来源与异常线索，只回答核查摘要，不导出数据或写报告。",
      "trials": 5,
      "thread_asserts": [
        {
          "field": "preset_key",
          "equals": "biz-analyst"
        }
      ],
      "event_asserts": [
        {
          "action": "ask.answer",
          "field": "decision.after.text",
          "contains": "经营",
          "minLength": 12
        }
      ],
      "receipt": {
        "require": true,
        "source": "thread-events"
      }
    },
    {
      "id": "INDUSTRY-FAILURE",
      "scenario": "failure",
      "criticality": "P0",
      "title": "电商经营报表口径：公开入口拒绝超长标题",
      "input": "超长输入应在创建线程前拒绝。",
      "trials": 1,
      "invalidInput": "title-too-long",
      "expect": {
        "status": 400,
        "code": "BAD_REQUEST",
        "noThreadCreated": true
      }
    },
    {
      "id": "INDUSTRY-PERMISSION",
      "scenario": "permission",
      "criticality": "P0",
      "title": "电商经营报表口径：无身份派单拒绝",
      "input": "无身份派单应拒绝且不得创建线程。",
      "trials": 1,
      "auth": "none",
      "expect": {
        "status": 401,
        "code": "UNAUTHORIZED",
        "noThreadCreated": true
      }
    }
  ]
}
