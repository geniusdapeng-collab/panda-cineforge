# 客群默认安装清单（§2.2 槽⑤班组装配的客群化默认配置）
# 用途：新工作区按客群一键初始化——预装技能（ordered：首屏展示顺序=销售叙事顺序）、启用 preset、围栏 patch。
# 纪律：清单只决定「默认装什么、什么前置」，运行时仍全量过围栏瀑布（L8.3）；客户后续可自助加装技能市场任意技能。
# 客户旅程：audit_only（只读体检 1-2 周）→ 影子模式（3 天）→ 正式托管（waist_single / cn_multi / global_group）。
version: ecommerce-segment-defaults/v2
segments:

  # ========== 质检模式（Audit-Only · 只读体检期）· 零风险先行 ==========
  audit_only:
    label: 质检模式（只读体检期）
    pitch: 先体检，再托管——13 平台店铺只读扫描，系统不动一根手指，1-2 周出《店铺体检报告》
    fence_patch: fences/patches/audit-only-patch.yml
    presets: [inspection-agent, biz-analyst, data-warehouse, sku-pl-accountant, competitor-radar, market-intel, account-guardian, rule-sentinel, ip-shield, service-qc, mm-engineer]  # 全部只读/分析岗，无写通道
    skills_ordered:  # 首屏顺序 = 五线巡检叙事：快扫当场见效→持续巡检→对账复核
      - fast-scan  # 旗舰：快照快扫，15-30 分钟当场出《快速体检报告》（售前验货与接入基线）
      - inspection-suite  # 持续：五线巡检套件（价格/库存/广告/客服口碑/合规）
      - shop-health-check
      - door-open-check
      - price-parity-watch  # 价格健康：倒挂/毛利破防/促销失误
      - margin-guard
      - inventory-cashline  # 库存健康：断货/积压/失衡
      - warehouse-age-watch
      - stockout-guard
      - ads-audit  # 广告健康：ACoS越线/烧钱词/预算浪费（估算可省金额）
      - review-defense-window  # 客服与口碑：差评未处理/SLA违约
      - service-qc
      - compliance-sentinel  # 合规风险：侵权词/绩效越限/跟卖
      - ip-shield
      - hijack-watch
      - account-health
      - multi-platform-reconciler  # 对账复核：账单与订单勾稽，发现渗漏
      - order-level-audit
      - sku-pl
      - sku-profit-ledger
      - competitor-product-track  # 竞对动态追踪
      - data-quality-watch
      - morning-briefing  # 每日体检晨报（只读版决策包：发现/建议/风险三栏）
      - incident-postmortem

  # ========== 单平台多店腰部卖家（一个人管 3 家店）· 卖 ROI ==========
  waist_single:
    label: 单平台多店腰部卖家
    pitch: 一个人管3家店，一年多赚30万
    fence_patch: fences/patches/waist-seller-patch.yml
    presets: [tmall-head, tmall-ops, tmall-ads, tmall-cs, biz-analyst, budget-controller, selection-analyst, demand-planner, procurement-buyer, sku-pl-accountant, competitor-radar, creative-studio, listing-factory, rule-sentinel, account-guardian]
    skills_ordered:  # 首屏顺序 = 卖点排序：清晨决策→利润守护→调价→广告→评价售后→库存补货→复盘
      - morning-briefing  # 旗舰：清晨决策包，一人多店的开工仪式
      - door-open-check
      - sku-pl  # SKU 级利润账，知道哪个链接真赚钱
      - sku-profit-ledger
      - margin-guard
      - profit-warn
      - dynamic-reprice  # 调价自动化（R1 10% 自治半径）
      - pricing-matrix
      - price-band-position
      - ads-audit  # 广告浪费钱第一时间发现
      - ads-budget-pacing
      - budget-watch
      - ztc-campaign
      - ylmf-campaign
      - ppc-keyword-mining
      - keyword-seo
      - listing-factory
      - listing-compliance
      - detail-page-studio
      - review-reply
      - review-defense-window  # 差评 2h 黄金窗口（R9）
      - rating-recovery
      - aftersale-defender
      - refund-flow
      - stockout-guard  # 断货=排名清零，补货前置（R7）
      - safety-stock-calc
      - replenishment-model
      - purchase-order-auto
      - competitor-product-track
      - weekly-ops-report

