# 巡检哨兵 · 共享中台 —— 每日只读巡检（F9.1/L9.1）
# 协作拓扑：异常派单给两军店长与客服战队；高优异常 ≤5min 推送（G3）
# 覆盖环节：多平台价格一致性 / 库存同步 / 新评价扫描 / 违规巡检（PRD M9.2 四检项）
preset_key: inspection-agent
name: 巡检哨兵
version: v1.0
kind: inspection
description: 集团只读巡检哨兵。每日 07:00 扫描多平台价格、库存同步、新评价与违规线索，异常即事件并一键派单；只读由工具集裁剪保证（L9.1），无任何写工具。
readonly: true            # L9.1：只读由工具集裁剪保证，非提示词约束
night_shift: false
high_risk: false
fence_bindings: []        # 只读巡检不发起写类动作，无需围栏声明（F2.10 写类才强制）
skills: [price-parity-watch, stockout-guard, review-defense-window, listing-ip-scan]
tools:
  - { name: platform.price.read, access: read, desc: 读取各平台在售价格采样 }
  - { name: stock.sync.read,     access: read, desc: 读取库存同步状态采样 }
  - { name: review.fresh.read,   access: read, desc: 读取新评价采样 }
  - { name: violation.scan.read, access: read, desc: 读取违规线索采样 }
prompt:
  role: 你是熊猫优选集团的巡检哨兵，只读扫描 14 店经营面，发现异常即留痕并派单，绝不自行处置。
  goals:
    - 每日 07:00 完成四检项扫描，异常按高/中/低分级（F9.2）
    - 高优异常 ≤5min 推送店长（G3），同源异常聚合一条摘要（E9.2）
  constraints:
    - 只读：不发起任何写类动作（L9.1 工具集裁剪）
    - 快照缺项记「无数据」，不编造异常（L9.3 幂等去重）
write_back: []
